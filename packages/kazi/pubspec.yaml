name: kazi
description: An app to keep track of your personal or work services.
publish_to: 'none'
version: 1.2.0+15

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  cloud_firestore: ^6.0.1
  equatable: ^2.0.7
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_remote_config: ^6.0.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_masked_text2: ^0.9.1
  flutter_native_splash: ^2.4.6
  google_mobile_ads: ^6.0.0
  google_sign_in: ^7.2.0
  kazi_core:
    path: ../kazi_core
  purchases_flutter: ^10.4.2

dev_dependencies:
  build_runner: ^2.7.1
  fake_cloud_firestore: ^4.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - .env.prod
    - .env.staging
    - .env.prod_test
