name: kazi
description: An app to keep track of your personal or work services.
publish_to: 'none'
version: 2.1.0+19

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  cloud_firestore: ^6.10.0
  equatable: ^2.1.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  kazi_core:
    path: ../kazi_core
  posthog_flutter: ^5.53.0
  purchases_flutter: ^10.15.2

dev_dependencies:
  build_runner: ^2.16.2
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  riverpod_generator: ^4.0.9

flutter:
  # google_mobile_ads is CocoaPods-only and depends on webview_flutter_wkwebview,
  # which SwiftPM would resolve separately. See ios/README.md.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - .env.prod
    - .env.staging
    - .env.prod_test
