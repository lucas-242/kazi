name: kazi_core
description: "A package to handle the Kazi core"
version: 0.7.0
homepage:

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=3.32.4"

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_masked_text2: ^0.9.1
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  http: ^1.6.0
  json_annotation: ^4.12.0
  image_picker: ^1.2.4
  in_app_review: ^2.0.12
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  syncfusion_flutter_calendar: ^35.1.39
  lucide_icons_flutter: ^3.1.24
dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mockito: ^5.8.1
  riverpod_generator: ^4.0.9
  intl_utils: ^2.8.17

flutter:
  uses-material-design: true
  assets:
    - lib/shared/assets/svgs/
  fonts:
    - family: KaziIcons
      fonts:
        - asset: lib/shared/assets/fonts/kazi_icons.otf
    - family: Archivo
      fonts:
        - asset: lib/shared/assets/fonts/Archivo-Variable.ttf
          weight: 400
        - asset: lib/shared/assets/fonts/Archivo-Variable.ttf
          weight: 500
        - asset: lib/shared/assets/fonts/Archivo-Variable.ttf
          weight: 600
        - asset: lib/shared/assets/fonts/Archivo-Variable.ttf
          weight: 800

flutter_intl:
  enabled: true
  class_name: KaziLocalizations
  main_locale: en
  arb_dir: lib/shared/l10n/arb
  output_dir: lib/shared/l10n/generated
  use_deferred_loading: false
